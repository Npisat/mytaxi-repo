# This is a Declarative Automation Bundle definition for mytaxi_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: mytaxi_bundle
  uuid: 2279b3e8-3706-41ce-a1ae-b2f70efbd9e4

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0f6a2325-b91e.cloud.databricks.com
    variables:
      catalog: nyctaxi
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-0f6a2325-b91e.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pisat.nilesh@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pisat.nilesh@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: nyctaxi
      schema: prod
    permissions:
      - user_name: pisat.nilesh@gmail.com
        level: CAN_MANAGE
